# PaperMC Maksimum Anti-Xray Konfigürasyonu (Engine Mode 2 - Obfuscate)
antixray:
  enabled: true
  engine-mode: 2
  max-block-height: 64
  update-radius: 2
  lava-obscures: true
  use-permission: false
  hidden-blocks:
    - chest
    - trapped_chest
    - coal_ore
    - deepslate_coal_ore
    - copper_ore
    - deepslate_copper_ore
    - raw_copper_block
    - diamond_ore
    - deepslate_diamond_ore
    - emerald_ore
    - deepslate_emerald_ore
    - gold_ore
    - deepslate_gold_ore
    - iron_ore
    - deepslate_iron_ore
    - raw_iron_block
    - lapis_ore
    - deepslate_lapis_ore
    - redstone_ore
    - deepslate_redstone_ore
    - nether_gold_ore
    - nether_quartz_ore
    - ancient_debris
  replacement-blocks:
    - stone
    - deepslate
    - granite
    - diorite
    - andesite
    - tuff
    - netherrack
