version: '3.8'

services:
  minecraft:
    build: .
    container_name: mc-paper-26-3
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      PAPER_CHANNEL: "experimental"
      ONLINE_MODE: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      OVERRIDE_SERVER_PROPERTIES: "TRUE"
      MEMORY: "16G"
      USE_AIKAR_FLAGS: "TRUE"
      MOTD: "omerinserver"
    ports:
      - "25565:25565/tcp"
      - "25565:25565/udp"
    restart: always
